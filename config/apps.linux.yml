apt:
  # Core
  - git
  - curl
  - build-essential
  - openssh-server

  # Shells
  - ttyd

  # File System
  - ripgrep

  # Zip
  - 7zip
  - unrar

  # Media
  - ffmpeg
  - celluloid
  - imagemagick
  - pandoc
  - id: obs-studio
    recommends: false
  - id: obs-plugins
    recommends: false
  - intel-media-va-driver-non-free

  # Dev
  - shfmt
  - mkcert

  # Docker
  - docker.io
  - docker-compose-v2
  - docker-buildx

  # Desktop
  - gnome-shell-extension-manager
  - wl-clipboard

  # Fonts
  - fonts-ibm-plex

  # Android Emulator
  - libxcb-cursor0

  # Build Libraries
  - pkg-config
  - clang
  - glslc
  - libclang-dev
  - libwebkit2gtk-4.1-dev
  - libgtk-3-dev
  - libayatana-appindicator3-dev
  - librsvg2-dev
  - libssl-dev
  - libxdo-dev
  - libx11-dev
  - libxtst-dev
  - libxi-dev
  - libasound2-dev
  - libdbus-1-dev
  - libvulkan-dev
  - libevdev-dev

apt-exclude:
  - vlc
  - vlc-bin
  - vlc-plugin-qt
  - vlc-plugin-skins2
  - vlc-l10n

snap:
  - slack
  - localsend
  - id: ghostty
    classic: true

deb:
  - id: google-chrome-stable
    url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
  - id: code
    url: https://update.code.visualstudio.com/latest/linux-deb-x64/stable
  - id: urserver
    url: https://www.unifiedremote.com/download/linux-x64-deb
  - id: freedownloadmanager
    url: https://files2.freedownloadmanager.org/6/latest/freedownloadmanager.deb
  - id: oi-per
    github: https://github.com/oiper/desktop
    asset: _amd64\.deb$
  - id: openlogi
    github: https://github.com/AprilNEA/OpenLogi
    asset: linux-amd64\.deb$
