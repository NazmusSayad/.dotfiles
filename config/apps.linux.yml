apt:
  # Core
  - git
  - curl
  - build-essential
  - openssh-server

  # Desktop
  - gnome-shell-extension-manager

  # Build Libraries
  - pkg-config
  - clang
  - glslc
  - libclang-dev
  - libwebkit2gtk-4.1-dev
  - libgtk-3-dev
  - libayatana-appindicator3-dev
  - librsvg2-dev
  - libssl-dev
  - libxdo-dev
  - libx11-dev
  - libxtst-dev
  - libxi-dev
  - libasound2-dev
  - libdbus-1-dev
  - libvulkan-dev
  - libevdev-dev

snap:
  - id: ghostty
    classic: true

deb:
  - id: google-chrome-stable
    url: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
  - id: code
    url: https://update.code.visualstudio.com/latest/linux-deb-x64/stable
  - id: urserver
    url: https://www.unifiedremote.com/download/linux-x64-deb
  - id: oi-per
    github: https://github.com/oiper/desktop
    asset: _amd64\.deb$
