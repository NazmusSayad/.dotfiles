#:schema https://mise.jdx.dev/schema/mise.json

[tools]

# Git
gh = "latest"
glab = "latest"
lazygit = "latest"
"github:unhappychoice/gitlogue" = "latest"
"github:JoaoOliveira889/monogit" = "latest"

# System
cmake = "latest"
"cargo:dotsh" = "latest"
"cargo:shaka" = "latest"
"aqua:Songmu/timeout" = "latest"

# File System
jq = "latest"
yq = "latest"
fd = "latest"
bat = "latest"
lsd = "latest"
fzf = "latest"
dust = "latest"
yazi = "latest"

# Activities
fastfetch = "latest"
"aqua:wakatime/wakatime-cli" = "latest"

# Workflow
just = "latest"
make = "latest"
ninja = "latest"

# AI Coding
codex = "latest"
claude = "latest"
opencode = "latest"

# JS/TS
node = "lts"
bun = "latest"
deno = "latest"
pnpm = "latest"
"npm:tsx" = "latest"
"npm:taze" = "latest"
"npm:@antfu/ni" = "latest"

# Python
uv = "latest"
python = "latest"

# GO
go = "latest"
air = "latest"
gofumpt = "latest"
"go:golang.org/x/tools/gopls" = "latest"

# Rust
rust = "stable"
rust-analyzer = "latest"

# Others
java = "latest"
# dart = "latest"
# kotlin = "latest"
# php = "latest"
# zig = "latest"
# ruby = "latest"
# "conda:lua" = "latest"
# "conda:luajit" = "latest"

# Dev
sqlite = "latest"
lazydocker = "latest"
hyperfine = "latest"
"npm:concurrently" = "latest"
"github:boyter/scc" = "latest"

# Web
"npm:serve" = "latest"
"npm:live-server" = "latest"

# Cloud
yt-dlp = "latest"
stripe = "latest"
firebase = "latest"
terraform = "latest"
cloudflared = "latest"
"npm:wrangler" = "latest"


# AI
"npm:skills" = "latest"
"npm:mytokens" = "latest"
"npm:opencode-armor" = "latest"

# Personal
"npm:gityo" = "latest"
"npm:netserv" = "latest"
"npm:uni-run" = "latest"
"npm:code-info" = "latest"
"npm:create-src" = "latest"

# MCP
"npm:chrome-devtools-mcp" = "latest"


[settings.node]
npm_shim = true

[settings.npm]
package_manager = "pnpm"

[settings]
auto_install = false
exec_auto_install = true
not_found_auto_install = true
trusted_config_paths = ["~/Desktop"]

minimum_release_age_excludes = [
  "bun",
  "node",
  "deno",
  "uv",
  "pnpm",
  "codex",
  "claude",
  "opencode",
]
