#:schema https://mise.jdx.dev/schema/mise.json

[tools]

# Git
gh = "latest"
glab = "latest"
lazygit = "latest"
delta = "latest"
git-lfs = "latest"
difftastic = "latest"
"npm:husky" = "latest"
hk = "latest"

# System
cmake = "latest"
"cargo:dotsh" = "latest"
"cargo:shaka" = "latest"
"cargo:pwshac" = { version = "latest", os = ["windows"] }

# Shell
"npm:offsite" =  "latest"
gsudo = { version = "latest", os = ["windows"] }

# File System
jq = "latest"
yq = "latest"
fd = "latest"
bat = "latest"
lsd = "latest"
fzf = "latest"
yazi = "latest"
superfile = "latest"
"github:restic/restic" = "latest"
"github:bootandy/dust" = "latest"
"github:microsoft/edit" = "latest"

# Activities
hyperfine = "latest"
fastfetch = "latest"
bottom = "latest"
"github:wakatime/wakatime-cli" = "latest"

# Workflow
just = "latest"
make = "latest"
ninja = "latest"

# AI Coding
codex = "latest"
"github:anomalyco/opencode" = "2"
"github:anthropics/claude-code" = "latest"

# JS/TS Runtime
node = "lts"
bun = "latest"
deno = "latest"

# JS/TS Tools
pnpm = "latest"
"npm:tsx" = "latest"
"npm:taze" = "latest"
"npm:@antfu/ni" = "latest"

# Python
uv = "latest"
python = "latest"

# GO
go = "latest"
air = "latest"
gofumpt = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"github:golangci/golangci-lint" = "latest"

# Rust
rust = "stable"
rust-analyzer = "latest"

# Cloud
aws = { version = "latest", symlink_bins = "true", os = ["macos"] }
cloudflared = { version = "latest", os = ["macos", "linux"] }
"npm:vercel" = "latest"

# Security
"osv-scanner" = "latest"
"github:SocketDev/sfw-free" = "latest"

# Dev
sqlite = "latest"
lazydocker = "latest"
"npm:prettier" = "latest"
"npm:lint-staged" = "latest"
"npm:concurrently" = "latest"
"github:boyter/scc" = "latest"
"github:NazmusSayad/makefmt" = "latest"

# Web
yt-dlp = "latest"
"npm:serve" = "latest"
"npm:live-server" = "latest"

# AI
"npm:skills" = "latest"
"npm:devrage" = "latest"
"npm:mysubs" = "latest"
"npm:mytokens" = "latest"
"pypi:mcp-proxy" = "latest"

# Personal
"npm:gityo" = "latest"
"npm:manygit" = "latest"
"npm:netserv" = "latest"
"npm:uni-run" = "latest"
"npm:create-src" = "latest"
"npm:opencode-ext" = "latest"

# Communication
"npm:@schpet/linear-cli" = "latest"
"github:stablyai/agent-slack" = { version = "latest", os = ["macos", "linux"] }
"github:NazmusSayad/agent-slack" = { version = "latest", os = ["windows"] }

# Browsers
"npm:@playwright/cli" = { version = "latest", postinstall = "playwright-cli install-browser chromium" }
"npm:@playwright/mcp" = "latest"
"npm:chrome-devtools-mcp" = "latest"

[env]
PLAYWRIGHT_MCP_BROWSER = "chromium"

[settings.npm]
package_manager = "pnpm"

[settings.python]
compile = false

[settings]
yes = true
cache_prune_age = "1d"

auto_update = false
auto_install = false
exec_auto_install = false
not_found_auto_install = false

trusted_config_paths = ["~/Desktop"]

minimum_release_age_excludes = [
  # Runtime
  "uv",
  "bun",
  "node",
  "deno",
  "pnpm",

  # AI Coding
  "github:anomalyco/opencode",
  "github:anthropics/claude-code",
  "github:google-antigravity/antigravity-cli",

  # My NPM Tools
  "npm:gityo",
  "npm:manygit",
  "npm:netserv",
  "npm:uni-run",
  "npm:offsite",
  "npm:mysubs",
  "npm:mytokens",
  "npm:create-src",
  "npm:opencode-ext",
  "github:NazmusSayad/agent-slack",

  # My Rust Tools
  "cargo:dotsh",
  "cargo:shaka",
  "cargo:pwshac",
  "github:nazmussayad/sshtty",
  "github:NazmusSayad/makefmt",
]
