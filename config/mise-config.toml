#:schema https://mise.jdx.dev/schema/mise.json

[tools]

# Git
gh = "latest"
glab = "latest"
lazygit = "latest"
"github:unhappychoice/gitlogue" = "latest"
"github:JoaoOliveira889/monogit" = "latest"

# System
cmake = "latest"
"cargo:dotsh" = "latest"
"cargo:shaka" = "latest"
"cargo:pwshac" = "latest"
"aqua:Songmu/timeout" = "latest"

# File System
jq = "latest"
yq = "latest"
fd = "latest"
bat = "latest"
lsd = "latest"
fzf = "latest"
dust = "latest"
yazi = "latest"

# Activities
fastfetch = "latest"
"github:wakatime/wakatime-cli" = "latest"

# Workflow
just = "latest"
make = "latest"
ninja = "latest"

# AI Coding
"github:anomalyco/opencode" = "latest"
"npm:@opencode-ai/cli" = { version = "beta", allow_builds = true }
"github:openai/codex" = "latest"
"github:anthropics/claude-code" = "latest"
"github:google-antigravity/antigravity-cli" = "latest"

# JS/TS
node = "lts"
bun = "latest"
deno = "latest"
pnpm = "latest"
"npm:tsx" = "latest"
"npm:taze" = "latest"
"npm:@antfu/ni" = "latest"

# Python
uv = "latest"
python = "latest"

# GO
go = "latest"
air = "latest"
gofumpt = "latest"
"go:golang.org/x/tools/gopls" = "latest"
"github:golangci/golangci-lint" = "latest"

# Rust
rust = "stable"
rust-analyzer = "latest"

# Others
# java = "latest"
# dart = "latest"
# kotlin = "latest"
# php = "latest"
# zig = "latest"
# ruby = "latest"
# "conda:lua" = "latest"
# "conda:luajit" = "latest"

# Dev
sqlite = "latest"
hyperfine = "latest"
lazydocker = "latest"
"npm:husky" = "latest"
"npm:prettier" = "latest"
"npm:lint-staged" = "latest"
"npm:concurrently" = "latest"
"github:boyter/scc" = "latest"

# Web
yt-dlp = "latest"
"npm:serve" = "latest"
"npm:live-server" = "latest"

# AI
"npm:skills" = "latest"
"npm:devrage" = "latest"
"npm:mysubs" = "latest"
"npm:mytokens" = "latest"

# Personal
"npm:gityo" = "latest"
"npm:netserv" = "latest"
"npm:uni-run" = "latest"
"npm:create-src" = "latest"
"npm:opencode-ext" = "latest"

# MCP
"npm:chrome-devtools-mcp" = "latest"

[settings.npm]
package_manager = "pnpm"

[settings]
yes = true
cache_prune_age = "7d"

auto_install = false
exec_auto_install = true
not_found_auto_install = true
trusted_config_paths = ["~/Desktop"]

minimum_release_age_excludes = [
  # Runtime
  "uv",
  "bun",
  "node",
  "deno",
  "pnpm",

  # AI Coding
  "github:anomalyco/opencode",
  "github:openai/codex",
  "github:anthropics/claude-code",
  "github:google-antigravity/antigravity-cli",

  # My NPM Tools
  "npm:gityo",
  "npm:netserv",
  "npm:uni-run",
  "npm:mysubs",
  "npm:mytokens",
  "npm:create-src",
  "npm:opencode-ext",

  # My Rust Tools
  "cargo:dotsh",
  "cargo:shaka",
  "cargo:pwshac",
]
