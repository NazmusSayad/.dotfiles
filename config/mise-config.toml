#:schema https://mise.jdx.dev/schema/mise.json

[tools]

# System Tools
cmake = "latest"
"cargo:dotsh" = "latest"
"cargo:shaka" = "latest"

# File System Tools
jq = "latest"
yq = "latest"
fd = "latest"
bat = "latest"
lsd = "latest"
fzf = "latest"
dust = "latest"
yazi = "latest"
"aqua:ogham/exa" = "latest"

# Media Tools
yt-dlp = "latest"
ffmpeg = "latest"
imagemagick = "latest"

# Activities Tools
bottom = "latest"
fastfetch = "latest"
"aqua:o2sh/onefetch" = "latest"
"aqua:imsnif/bandwhich" = "latest"
"aqua:wakatime/wakatime-cli" = "latest"


# Workflow Tools
just = "latest"
make = "latest"
ninja = "latest"


# JS/TS
node = "lts"
bun = "latest"
deno = "latest"
pnpm = "latest"
"npm:tsx" = "latest"
"npm:taze" = "latest"
"npm:@antfu/ni" = "latest"


# Python
uv = "latest"
python = "latest"


# GO
go = "latest"
air = "latest"
gofumpt = "latest"
"go:golang.org/x/tools/gopls" = "latest"


# Rust
rust = "stable"
rust-analyzer = "latest"


# Mobile Apps
java = "latest"
# dart = "latest"
# kotlin = "latest"


# php = "latest"
# zig = "latest"
# ruby = "latest"
# "conda:lua" = "latest"
# "conda:luajit" = "latest"


# NPM Tools
"npm:serve" = "latest"
"npm:git-stats" = "latest"
"npm:live-server" = "latest"
"npm:concurrently" = "latest"

# Dev Tools
sqlite = "latest"
lazygit = "latest"
lazydocker = "latest"
hyperfine = "latest"
"github:boyter/scc" = "latest"
"github:JoaoOliveira889/monogit" = "latest"

# Fun Tools
"cargo:gitlogue" = "latest"

# AI Tools
"npm:skills" = "latest"
"npm:devrage" = { version = "latest", allow_builds = ["better-sqlite3"] }

# My Tools
"npm:gityo" = "latest"
"npm:netserv" = "latest"
"npm:uni-run" = "latest"
"npm:mytokens" = "latest"
"npm:code-info" = "latest"
"npm:create-src" = "latest"
"npm:opencode-armor" = "latest"


# MCP
"npm:chrome-devtools-mcp" = "latest"


# Cloud Tools
stripe = "latest"
firebase = "latest"
wrangler = "latest"
terraform = "latest"


[settings]
auto_install = false
exec_auto_install = true
not_found_auto_install = true

node.npm_shim = true
npm.package_manager = "pnpm"

trusted_config_paths = ["~/Desktop"]
minimum_release_age_excludes = [
  # Tools
  "pnpm",

  # My Cargo Tools
  "cargo:dotsh",
  "cargo:shaka",

  # My NPM Tools
  "npm:gityo",
  "npm:netserv",
  "npm:uni-run",
  "npm:mytokens",
  "npm:code-info",
  "npm:create-src",
  "npm:opencode-armor",
]
