# Shell
"@/config/shell/bash/bashrc.sh": "~/.bashrc"
"@/config/shell/fish/fishrc.fish": "~/.config/fish/config.fish"
"@/config/shell/pwsh/pwshrc.ps1":
  LinkWin: "~/Documents/PowerShell/profile.ps1"
"@/config/shell/bash/profile.mac.sh":
  LinkMac: "~/.bash_profile"

# Agents Skills
"@/agents/skills":
  - "~/.agents/skills"
  - "~/.claude/skills"
  - "~/.claude-extra/skills"
  - "~/.claude-test/skills"
  - "~/.gemini/antigravity-cli/skills"

# AGENTS.md, CLAUDE.md
"@/agents/AGENTS_MD.md":
  - "~/.config/opencode/AGENTS.md"
  - "~/.gemini/GEMINI.md"
"@/agents/CLAUDE_MD.md":
  - "~/.claude/CLAUDE.md"
  - "~/.claude-extra/CLAUDE.md"
  - "~/.claude-test/CLAUDE.md"

# Claude Code
"@/agents/mods": "~/.claude.mods"
"@/agents/claude.json":
  - "~/.claude/settings.json"
  - "~/.claude-extra/settings.json"
  - "~/.claude-test/settings.json"

# Claude Accounts
"~/.claude/history.jsonl":
  Create: File
  Link: "~/.claude-extra/history.jsonl"
"~/.claude/jobs":
  Create: Folder
  Link: "~/.claude-extra/jobs"
"~/.claude/plans":
  Create: Folder
  Link: "~/.claude-extra/plans"
"~/.claude/tasks":
  Create: Folder
  Link: "~/.claude-extra/tasks"
"~/.claude/cache":
  Create: Folder
  Link: "~/.claude-extra/cache"
"~/.claude/state":
  Create: Folder
  Link: "~/.claude-extra/state"
"~/.claude/plugins":
  Create: Folder
  Link: "~/.claude-extra/plugins"
"~/.claude/projects":
  Create: Folder
  Link: "~/.claude-extra/projects"
"~/.claude/sessions":
  Create: Folder
  Link: "~/.claude-extra/sessions"
"~/.claude/paste-cache":
  Create: Folder
  Link: "~/.claude-extra/paste-cache"
"~/.claude/session-env":
  Create: Folder
  Link: "~/.claude-extra/session-env"
"~/.claude/shell-snapshots":
  Create: Folder
  Link: "~/.claude-extra/shell-snapshots"

# OpenCode
"@/agents/opencode/plugins": "~/.config/opencode/plugins"
"@/agents/opencode/sounds": "~/.config/opencode/sounds"
"@/agents/opencode/themes": "~/.config/opencode/themes"
"@/agents/opencode/ext.json": "~/.opencode-ext.json"

# OpenCode Desktop
"@/agents/opencode/desktop.dat":
  CopyWin: "$APPDATA/ai.opencode.desktop/default.dat"
  CopyMac: "~/Library/Application Support/ai.opencode.desktop/default.dat"

# OffSite
"@/agents/offsite.json": "~/.offsite/config.json"

# Terminal
"@/config/shell/alias.json": "~/.config/shaka/config.json"
"@/config/shell/starship.toml": "~/.config/starship.toml"
"@/config/shell/direnv.toml": "~/.config/direnv/direnv.toml"
"@/config/shell/lsd-config.yaml": "~/.config/lsd/config.yaml"
"@/config/mise-config.toml": "~/.config/mise/config.toml"
"@/config/shell/fastfetch-win.jsonc":
  LinkWin: "~/.config/fastfetch/config.jsonc"
"@/config/shell/fastfetch-mac.jsonc":
  LinkMac: "~/.config/fastfetch/config.jsonc"
"@/config/shell/btop.conf":
  Copy: "~/.config/btop/btop.conf"

# Terminal Emulators
"@/config/shell/ghostty.conf":
  LinkMac: "~/.config/ghostty/config"
"@/config/shell/cmux.json":
  CopyMac: "~/.config/cmux/cmux.json"
"@/config/windows-terminal.json":
  LinkWin: "$LOCALAPPDATA/Packages/Microsoft.WindowsTerminal_8wekyb3d8bbwe/LocalState/settings.json"

# OBS
"@/config/obs/basic-win":
  CopyWin: "$APPDATA/obs-studio/basic"
"@/config/obs/user-win.ini":
  CopyWin: "$APPDATA/obs-studio/user.ini"
"@/config/obs/basic-mac":
  CopyMac: "~/Library/Application Support/obs-studio/basic"
"@/config/obs/user-mac.ini":
  CopyMac: "~/Library/Application Support/obs-studio/user.ini"

# Git
"@/config/global.gitignore": "~/.gitignore"
"@/config/monogit.json":
  CopyWin: "$APPDATA/monogit/config.json"
  CopyMac: "~/Library/Application Support/monogit/config.json"

# Other
"@/config/colima.yaml":
  CopyMac: "~/.colima/default/colima.yaml"
"@/config/docker-mac.json":
  CopyMac: "~/.docker/config.json"
"@/config/pnpm.yaml":
  LinkWsl: "~/.config/pnpm/config.yaml"
  LinkMac: "~/Library/Preferences/pnpm/config.yaml"
"@/config/pnpm-win.yaml":
  LinkWin: "$LOCALAPPDATA/pnpm/config.yaml"
"@/config/oiper.json":
  LinkWin: "$APPDATA/com.oiper.desktop/config.json"
  LinkMac: "~/Library/Application Support/com.oiper.desktop/config.json"
"@/config/uni-run.json": "~/.uni-run.json"
"@/config/mysubs.json": "~/.config/mysubs/config.json"
"@/config/mytokens-group.json": "~/.mytokens/groups.json"
"@/config/cloudflared-win.yml":
  LinkWin: "~/.cloudflared/config.yml"
"@/config/cloudflared-mac.yml":
  LinkMac: "~/.cloudflared/config.yml"
"@/config/cloudflared-mac.plist":
  CopyMac: "~/Library/LaunchAgents/cc.sayad.cloudflared.plist"
"@/config/offsite-mac.plist":
  CopyMac: "~/Library/LaunchAgents/cc.sayad.offsite.plist"
"@/config/wsl/wslconfig.ini":
  LinkWin: "~/.wslconfig"
"@/config/gityo.json": "~/.config/gityo.json"
"@/config/nirc": "~/.nirc"

# System
"@/config/Windhawk.json":
  LinkWin: "$PROGRAMDATA/Windhawk/userprofile.json"
"@/config/hammerspoon.lua":
  LinkMac: "~/.hammerspoon/init.lua"
"@/config/US Simplified.keylayout":
  CopyMac: "~/Library/Keyboard Layouts/US Simplified.keylayout"

# Private
"$SYSTEM_FILE_DIR/AIMP":
  LinkWin: "$APPDATA/AIMP"
"$SYSTEM_FILE_DIR/WinRar.ini":
  LinkWin: "~/scoop/apps/winrar/current/WinRar.ini"
"$SYSTEM_FILE_DIR/qBittorrent.ini":
  CopyWin: "$APPDATA/qBittorrent/qBittorrent.ini"

# Code Editor
"@/config/vscode/settings.jsonc":
  LinkWin:
    - "$APPDATA/Code/User/settings.json"
    - "$APPDATA/Code - Insiders/User/settings.json"
  LinkMac:
    - "~/Library/Application Support/Code/User/settings.json"
    - "~/Library/Application Support/Code - Insiders/User/settings.json"
"@/config/vscode/keybindings.jsonc":
  LinkWin:
    - "$APPDATA/Code/User/keybindings.json"
    - "$APPDATA/Code - Insiders/User/keybindings.json"
"@/config/vscode/mac-keybindings.jsonc":
  LinkMac:
    - "~/Library/Application Support/Code/User/keybindings.json"
    - "~/Library/Application Support/Code - Insiders/User/keybindings.json"
