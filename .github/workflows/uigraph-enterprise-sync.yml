name: UiGraph Sync

on:
  push:
    branches:
      - "main"
    paths:
      - ".uigraph.yaml"
      - ".uigraph/**"
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: uigraph-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync to UiGraph
    runs-on: ubuntu-latest
    steps:
      - name: Validating configuration
        env:
          UIGRAPH_TOKEN: ${{ secrets.UIGRAPH_TOKEN }}
        run: |
          missing=""
          test -n "$UIGRAPH_TOKEN" || missing="$missing UIGRAPH_TOKEN"
          test -z "$missing" || { printf 'Missing required configuration:%s\n' "$missing"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go install github.com/uigraph-oss/uigraph-cli@main
      - name: Sync
        env:
          UIGRAPH_TOKEN: ${{ secrets.UIGRAPH_TOKEN }}
        run: uigraph-cli sync --enterprise
