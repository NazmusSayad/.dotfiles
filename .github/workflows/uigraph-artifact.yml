name: UiGraph Artifact Update

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - ".uigraph.yaml"
      - ".uigraph/**"
      - ".github/workflows/uigraph-*.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: uigraph-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Validating configuration
        env:
          AI_PROVIDER_API_KEY: ${{ secrets.AI_PROVIDER_API_KEY }}
          AI_PROVIDER_MODEL: ${{ secrets.AI_PROVIDER_MODEL || vars.AI_PROVIDER_MODEL }}
          AI_PROVIDER_API_URL: ${{ secrets.AI_PROVIDER_API_URL || vars.AI_PROVIDER_API_URL }}
          AI_PROVIDER_NPM: ${{ secrets.AI_PROVIDER_NPM || vars.AI_PROVIDER_NPM }}
          UIGRAPH_API_URL: ${{ vars.UIGRAPH_API_URL || secrets.UIGRAPH_API_URL }}
          UIGRAPH_TOKEN: ${{ secrets.UIGRAPH_TOKEN }}
        run: |
          missing=""
          test -n "$AI_PROVIDER_API_KEY" || missing="$missing AI_PROVIDER_API_KEY"
          test -n "$AI_PROVIDER_MODEL" || missing="$missing AI_PROVIDER_MODEL"
          test -n "$AI_PROVIDER_API_URL" || test -n "$AI_PROVIDER_NPM" || missing="$missing AI_PROVIDER_API_URL|AI_PROVIDER_NPM"
          test -n "$UIGRAPH_API_URL" || missing="$missing UIGRAPH_API_URL"
          test -n "$UIGRAPH_TOKEN" || missing="$missing UIGRAPH_TOKEN"
          test -z "$missing" || { printf 'Missing required configuration:%s\n' "$missing"; exit 1; }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update repository artifacts
        env:
          AI_PROVIDER_API_KEY: ${{ secrets.AI_PROVIDER_API_KEY }}
          AI_PROVIDER_MODEL: ${{ secrets.AI_PROVIDER_MODEL || vars.AI_PROVIDER_MODEL }}
          AI_PROVIDER_API_URL: ${{ secrets.AI_PROVIDER_API_URL || vars.AI_PROVIDER_API_URL }}
          AI_PROVIDER_NPM: ${{ secrets.AI_PROVIDER_NPM || vars.AI_PROVIDER_NPM }}
          UIGRAPH_API_URL: ${{ vars.UIGRAPH_API_URL || secrets.UIGRAPH_API_URL }}
          UIGRAPH_TOKEN: ${{ secrets.UIGRAPH_TOKEN }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "The commit pushed over is unavailable, there is nothing to compare against"
            exit 0
          fi
          npx --yes @uigraph/agents artifacts sync --target "$BASE_SHA"
      - name: Restrict generated changes
        run: |
          unexpected=$(git status --porcelain | awk '{print $2}' | grep -Ev '^(.uigraph.yaml|.uigraph/)' || true)
          test -z "$unexpected" || { printf 'Generation changed unsupported paths:\n%s\n' "$unexpected"; exit 1; }
      - name: Open artifact pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "uigraph-artifact[bot]"
          git config user.email "uigraph-artifact[bot]@users.noreply.github.com"
          git add .uigraph.yaml
          if [ -d .uigraph ]; then
            git add .uigraph
          fi
          if git diff --cached --quiet; then
            echo "Artifacts are already up to date"
          else
            branch="uigraph/artifacts/${GITHUB_RUN_ID}"
            git checkout -b "$branch"
            git commit -m "chore(uigraph): update repository artifacts"
            git push origin "$branch"
            gh pr create --base "$BASE_BRANCH" --head "$branch" --title "UiGraph: update repository artifacts" --body "Generated by the UiGraph artifact workflow."
          fi
